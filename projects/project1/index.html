<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="code.js">
  <title>JavaScript Background Color Switch</title>
</head>
<body>
  <!--aria - accessible rich internet application it tells the page reader that this is the current page and its change according to page changes-->
  <nav>
    <a href="/" aria-current="page">Home</a> 
  </nav>
  
  <div  class="canvas">


    <h1>Color Scheme Switcher</h1>
    <div class="buttons">
      <span class="Button" id="grey"></span>
      <span class="Button" id="white"></span>
      <span class="Button" id="blue"></span>
      <span class="Button" id="yellow"></span>
      <span class="Button" id="purple"></span>
    </div>
    <h2>
      Try clicking on one of the colors above
      <span>to change the background color of this page!</span>
    </h2>
  </div>
  <script src="code.js"></script>
</body>
</html>
